<div class="form-container">
  <h2>Add New Student</h2>
  <form (ngSubmit)="onSubmit()">
    <label>Name:</label>
    <input type="text" [(ngModel)]="newStudent.name" name="name" required />

    <label>Email:</label>
    <input type="email" [(ngModel)]="newStudent.email" name="email" required />

    <label>Age:</label>
    <input type="number" [(ngModel)]="newStudent.age" name="age" required />

    <label>Course:</label>
    <input type="text" [(ngModel)]="newStudent.course" name="course" required />

    <button type="submit">Submit</button>
  </form>
</div>
